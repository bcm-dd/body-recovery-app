<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a"/>
      <stop offset="50%" style="stop-color:#111827"/>
      <stop offset="100%" style="stop-color:#0a0e1a"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#818cf8"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.1)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.05)"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGradient)"/>

  <!-- Decorative blurs -->
  <circle cx="200" cy="150" r="200" fill="#6366f1" opacity="0.1" filter="url(#glow)"/>
  <circle cx="1100" cy="550" r="250" fill="#22d3ee" opacity="0.08" filter="url(#glow)"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="260" height="720" fill="rgba(255,255,255,0.03)"/>
  <rect x="259" y="0" width="1" height="720" fill="rgba(255,255,255,0.1)"/>

  <!-- Logo area in sidebar -->
  <g transform="translate(30, 30)">
    <circle cx="20" cy="20" r="18" fill="url(#primaryGrad)"/>
    <text x="48" y="26" fill="white" font-family="system-ui" font-size="18" font-weight="600">Body Recovery</text>
  </g>

  <!-- Sidebar nav items -->
  <g transform="translate(20, 100)">
    <!-- Active item -->
    <rect x="0" y="0" width="220" height="44" rx="10" fill="url(#primaryGrad)" opacity="0.2"/>
    <rect x="0" y="0" width="4" height="44" rx="2" fill="url(#primaryGrad)"/>
    <text x="50" y="28" fill="white" font-family="system-ui" font-size="14" font-weight="500">Dashboard</text>

    <!-- Other items -->
    <text x="50" y="78" fill="rgba(255,255,255,0.6)" font-family="system-ui" font-size="14">Body Map</text>
    <text x="50" y="128" fill="rgba(255,255,255,0.6)" font-family="system-ui" font-size="14">Progress</text>
    <text x="50" y="178" fill="rgba(255,255,255,0.6)" font-family="system-ui" font-size="14">History</text>
    <text x="50" y="228" fill="rgba(255,255,255,0.6)" font-family="system-ui" font-size="14">Settings</text>
  </g>

  <!-- Main content area -->
  <g transform="translate(300, 40)">
    <!-- Header -->
    <text x="0" y="30" fill="white" font-family="system-ui" font-size="28" font-weight="700">Good morning, User</text>
    <text x="0" y="58" fill="rgba(255,255,255,0.6)" font-family="system-ui" font-size="14">Track your recovery journey</text>

    <!-- Stats cards row -->
    <g transform="translate(0, 90)">
      <!-- Card 1 - Pain Level -->
      <g>
        <rect x="0" y="0" width="220" height="120" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
        <text x="20" y="35" fill="rgba(255,255,255,0.6)" font-family="system-ui" font-size="12">Current Pain Level</text>
        <text x="20" y="75" fill="white" font-family="system-ui" font-size="36" font-weight="700">3.2</text>
        <text x="80" y="75" fill="#22c55e" font-family="system-ui" font-size="14">-1.5 this week</text>
      </g>

      <!-- Card 2 - Sessions -->
      <g transform="translate(240, 0)">
        <rect x="0" y="0" width="220" height="120" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
        <text x="20" y="35" fill="rgba(255,255,255,0.6)" font-family="system-ui" font-size="12">Sessions This Week</text>
        <text x="20" y="75" fill="white" font-family="system-ui" font-size="36" font-weight="700">5</text>
        <text x="50" y="75" fill="rgba(255,255,255,0.6)" font-family="system-ui" font-size="14">/ 7 goal</text>
      </g>

      <!-- Card 3 - Streak -->
      <g transform="translate(480, 0)">
        <rect x="0" y="0" width="220" height="120" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
        <text x="20" y="35" fill="rgba(255,255,255,0.6)" font-family="system-ui" font-size="12">Current Streak</text>
        <text x="20" y="75" fill="white" font-family="system-ui" font-size="36" font-weight="700">12</text>
        <text x="60" y="75" fill="#f59e0b" font-family="system-ui" font-size="14">days</text>
      </g>
    </g>

    <!-- Chart area -->
    <g transform="translate(0, 240)">
      <rect x="0" y="0" width="720" height="280" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="24" y="35" fill="white" font-family="system-ui" font-size="16" font-weight="600">Pain Trend</text>

      <!-- Chart line -->
      <polyline
        points="40,200 100,180 160,190 220,150 280,140 340,120 400,130 460,100 520,90 580,85 640,75 700,70"
        fill="none"
        stroke="url(#primaryGrad)"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      <!-- Chart area fill -->
      <polygon
        points="40,200 100,180 160,190 220,150 280,140 340,120 400,130 460,100 520,90 580,85 640,75 700,70 700,240 40,240"
        fill="url(#primaryGrad)"
        opacity="0.1"
      />

      <!-- X-axis labels -->
      <text x="40" y="260" fill="rgba(255,255,255,0.5)" font-family="system-ui" font-size="10">Mon</text>
      <text x="160" y="260" fill="rgba(255,255,255,0.5)" font-family="system-ui" font-size="10">Tue</text>
      <text x="280" y="260" fill="rgba(255,255,255,0.5)" font-family="system-ui" font-size="10">Wed</text>
      <text x="400" y="260" fill="rgba(255,255,255,0.5)" font-family="system-ui" font-size="10">Thu</text>
      <text x="520" y="260" fill="rgba(255,255,255,0.5)" font-family="system-ui" font-size="10">Fri</text>
      <text x="640" y="260" fill="rgba(255,255,255,0.5)" font-family="system-ui" font-size="10">Sat</text>
    </g>
  </g>

  <!-- Right panel - Today's exercises -->
  <g transform="translate(760, 130)">
    <rect x="0" y="0" width="480" height="390" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="24" y="35" fill="white" font-family="system-ui" font-size="16" font-weight="600">Today's Session</text>
    <text x="24" y="55" fill="rgba(255,255,255,0.5)" font-family="system-ui" font-size="12">3 exercises - 15 min</text>

    <!-- Exercise items -->
    <g transform="translate(24, 80)">
      <!-- Exercise 1 -->
      <rect x="0" y="0" width="432" height="70" rx="12" fill="rgba(255,255,255,0.05)"/>
      <circle cx="35" cy="35" r="22" fill="url(#primaryGrad)" opacity="0.2"/>
      <text x="35" y="40" fill="white" font-family="system-ui" font-size="14" text-anchor="middle">1</text>
      <text x="70" y="28" fill="white" font-family="system-ui" font-size="14" font-weight="500">Cat-Cow Stretch</text>
      <text x="70" y="48" fill="rgba(255,255,255,0.5)" font-family="system-ui" font-size="12">3 sets x 10 reps</text>

      <!-- Exercise 2 -->
      <g transform="translate(0, 85)">
        <rect x="0" y="0" width="432" height="70" rx="12" fill="rgba(255,255,255,0.05)"/>
        <circle cx="35" cy="35" r="22" fill="url(#primaryGrad)" opacity="0.2"/>
        <text x="35" y="40" fill="white" font-family="system-ui" font-size="14" text-anchor="middle">2</text>
        <text x="70" y="28" fill="white" font-family="system-ui" font-size="14" font-weight="500">Hip Circles</text>
        <text x="70" y="48" fill="rgba(255,255,255,0.5)" font-family="system-ui" font-size="12">2 sets x 15 reps each side</text>
      </g>

      <!-- Exercise 3 -->
      <g transform="translate(0, 170)">
        <rect x="0" y="0" width="432" height="70" rx="12" fill="rgba(255,255,255,0.05)"/>
        <circle cx="35" cy="35" r="22" fill="url(#primaryGrad)" opacity="0.2"/>
        <text x="35" y="40" fill="white" font-family="system-ui" font-size="14" text-anchor="middle">3</text>
        <text x="70" y="28" fill="white" font-family="system-ui" font-size="14" font-weight="500">Child's Pose</text>
        <text x="70" y="48" fill="rgba(255,255,255,0.5)" font-family="system-ui" font-size="12">Hold for 30 seconds x 3</text>
      </g>
    </g>

    <!-- Start button -->
    <rect x="24" y="330" width="432" height="44" rx="12" fill="url(#primaryGrad)"/>
    <text x="240" y="358" fill="white" font-family="system-ui" font-size="14" font-weight="600" text-anchor="middle">Start Session</text>
  </g>

  <!-- AI Assistant bubble -->
  <g transform="translate(760, 540)">
    <rect x="0" y="0" width="480" height="100" rx="16" fill="url(#cardGrad)" stroke="rgba(99,102,241,0.3)" stroke-width="1"/>
    <circle cx="45" cy="50" r="20" fill="url(#primaryGrad)"/>
    <text x="45" y="55" fill="white" font-family="system-ui" font-size="16" text-anchor="middle">AI</text>
    <text x="80" y="35" fill="white" font-family="system-ui" font-size="14" font-weight="500">Recovery Insight</text>
    <text x="80" y="55" fill="rgba(255,255,255,0.7)" font-family="system-ui" font-size="12">Your lower back pain has improved 25%</text>
    <text x="80" y="73" fill="rgba(255,255,255,0.7)" font-family="system-ui" font-size="12">this week. Keep up the great work!</text>
  </g>
</svg>
