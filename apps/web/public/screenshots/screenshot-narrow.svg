<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a"/>
      <stop offset="50%" style="stop-color:#111827"/>
      <stop offset="100%" style="stop-color:#0a0e1a"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#818cf8"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.1)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.05)"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="390" height="844" fill="url(#bgGradient)"/>

  <!-- Decorative blurs -->
  <circle cx="50" cy="100" r="120" fill="#6366f1" opacity="0.1" filter="url(#glow)"/>
  <circle cx="350" cy="700" r="150" fill="#22d3ee" opacity="0.08" filter="url(#glow)"/>

  <!-- Status bar area -->
  <rect x="0" y="0" width="390" height="44" fill="transparent"/>

  <!-- Header -->
  <g transform="translate(20, 60)">
    <text x="0" y="24" fill="white" font-family="system-ui" font-size="24" font-weight="700">Good morning</text>
    <text x="0" y="48" fill="rgba(255,255,255,0.6)" font-family="system-ui" font-size="14">Track your recovery</text>
  </g>

  <!-- Quick stats row -->
  <g transform="translate(20, 130)">
    <!-- Pain stat -->
    <g>
      <rect x="0" y="0" width="110" height="80" rx="14" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="15" y="25" fill="rgba(255,255,255,0.6)" font-family="system-ui" font-size="10">Pain Level</text>
      <text x="15" y="55" fill="white" font-family="system-ui" font-size="24" font-weight="700">3.2</text>
      <text x="55" y="55" fill="#22c55e" font-family="system-ui" font-size="10">-1.5</text>
    </g>

    <!-- Sessions stat -->
    <g transform="translate(120, 0)">
      <rect x="0" y="0" width="110" height="80" rx="14" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="15" y="25" fill="rgba(255,255,255,0.6)" font-family="system-ui" font-size="10">Sessions</text>
      <text x="15" y="55" fill="white" font-family="system-ui" font-size="24" font-weight="700">5/7</text>
    </g>

    <!-- Streak stat -->
    <g transform="translate(240, 0)">
      <rect x="0" y="0" width="110" height="80" rx="14" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="15" y="25" fill="rgba(255,255,255,0.6)" font-family="system-ui" font-size="10">Streak</text>
      <text x="15" y="55" fill="white" font-family="system-ui" font-size="24" font-weight="700">12</text>
      <text x="48" y="55" fill="#f59e0b" font-family="system-ui" font-size="10">days</text>
    </g>
  </g>

  <!-- Body Map Card -->
  <g transform="translate(20, 235)">
    <rect x="0" y="0" width="350" height="200" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="20" y="30" fill="white" font-family="system-ui" font-size="16" font-weight="600">Pain Areas</text>

    <!-- Simplified body outline -->
    <g transform="translate(175, 50)">
      <!-- Head -->
      <circle cx="0" cy="15" r="15" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>

      <!-- Body -->
      <line x1="0" y1="30" x2="0" y2="85" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>

      <!-- Arms -->
      <line x1="0" y1="45" x2="-35" y2="70" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
      <line x1="0" y1="45" x2="35" y2="70" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>

      <!-- Legs -->
      <line x1="0" y1="85" x2="-20" y2="130" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
      <line x1="0" y1="85" x2="20" y2="130" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>

      <!-- Pain indicators -->
      <circle cx="0" cy="65" r="12" fill="#ef4444" opacity="0.6" filter="url(#glow)"/>
      <circle cx="-30" cy="50" r="8" fill="#f59e0b" opacity="0.6"/>
      <circle cx="18" cy="105" r="8" fill="#22c55e" opacity="0.6"/>
    </g>

    <!-- Legend -->
    <g transform="translate(280, 60)">
      <circle cx="0" cy="0" r="6" fill="#ef4444"/>
      <text x="14" y="4" fill="rgba(255,255,255,0.7)" font-family="system-ui" font-size="10">High</text>

      <circle cx="0" cy="25" r="6" fill="#f59e0b"/>
      <text x="14" y="29" fill="rgba(255,255,255,0.7)" font-family="system-ui" font-size="10">Medium</text>

      <circle cx="0" cy="50" r="6" fill="#22c55e"/>
      <text x="14" y="54" fill="rgba(255,255,255,0.7)" font-family="system-ui" font-size="10">Low</text>
    </g>
  </g>

  <!-- Today's Session Card -->
  <g transform="translate(20, 455)">
    <rect x="0" y="0" width="350" height="220" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="20" y="30" fill="white" font-family="system-ui" font-size="16" font-weight="600">Today's Session</text>
    <text x="20" y="48" fill="rgba(255,255,255,0.5)" font-family="system-ui" font-size="12">3 exercises - 15 min</text>

    <!-- Exercise list -->
    <g transform="translate(20, 65)">
      <rect x="0" y="0" width="310" height="50" rx="10" fill="rgba(255,255,255,0.05)"/>
      <circle cx="25" cy="25" r="15" fill="url(#primaryGrad)" opacity="0.3"/>
      <text x="25" y="30" fill="white" font-family="system-ui" font-size="12" text-anchor="middle">1</text>
      <text x="50" y="22" fill="white" font-family="system-ui" font-size="13" font-weight="500">Cat-Cow Stretch</text>
      <text x="50" y="38" fill="rgba(255,255,255,0.5)" font-family="system-ui" font-size="11">3 sets x 10 reps</text>

      <g transform="translate(0, 58)">
        <rect x="0" y="0" width="310" height="50" rx="10" fill="rgba(255,255,255,0.05)"/>
        <circle cx="25" cy="25" r="15" fill="url(#primaryGrad)" opacity="0.3"/>
        <text x="25" y="30" fill="white" font-family="system-ui" font-size="12" text-anchor="middle">2</text>
        <text x="50" y="22" fill="white" font-family="system-ui" font-size="13" font-weight="500">Hip Circles</text>
        <text x="50" y="38" fill="rgba(255,255,255,0.5)" font-family="system-ui" font-size="11">2 sets x 15 reps</text>
      </g>
    </g>

    <!-- Start button -->
    <rect x="20" y="175" width="310" height="40" rx="10" fill="url(#primaryGrad)"/>
    <text x="175" y="200" fill="white" font-family="system-ui" font-size="14" font-weight="600" text-anchor="middle">Start Session</text>
  </g>

  <!-- AI Insight bubble -->
  <g transform="translate(20, 695)">
    <rect x="0" y="0" width="350" height="70" rx="14" fill="url(#cardGrad)" stroke="rgba(99,102,241,0.3)" stroke-width="1"/>
    <circle cx="40" cy="35" r="18" fill="url(#primaryGrad)"/>
    <text x="40" y="40" fill="white" font-family="system-ui" font-size="14" text-anchor="middle">AI</text>
    <text x="70" y="28" fill="white" font-family="system-ui" font-size="12" font-weight="500">Your progress is looking great!</text>
    <text x="70" y="46" fill="rgba(255,255,255,0.6)" font-family="system-ui" font-size="11">Lower back pain improved 25% this week.</text>
  </g>

  <!-- Bottom navigation -->
  <g transform="translate(0, 780)">
    <rect x="0" y="0" width="390" height="64" fill="rgba(17,24,39,0.95)"/>
    <rect x="0" y="0" width="390" height="1" fill="rgba(255,255,255,0.1)"/>

    <!-- Nav items -->
    <g transform="translate(35, 12)">
      <rect x="-10" y="-5" width="50" height="40" rx="8" fill="url(#primaryGrad)" opacity="0.2"/>
      <circle cx="15" cy="12" r="10" fill="url(#primaryGrad)" opacity="0.3"/>
      <text x="15" y="35" fill="white" font-family="system-ui" font-size="10" text-anchor="middle">Home</text>
    </g>

    <g transform="translate(115, 12)">
      <circle cx="15" cy="12" r="10" fill="rgba(255,255,255,0.1)"/>
      <text x="15" y="35" fill="rgba(255,255,255,0.5)" font-family="system-ui" font-size="10" text-anchor="middle">Body</text>
    </g>

    <g transform="translate(195, 12)">
      <circle cx="15" cy="12" r="10" fill="rgba(255,255,255,0.1)"/>
      <text x="15" y="35" fill="rgba(255,255,255,0.5)" font-family="system-ui" font-size="10" text-anchor="middle">Progress</text>
    </g>

    <g transform="translate(275, 12)">
      <circle cx="15" cy="12" r="10" fill="rgba(255,255,255,0.1)"/>
      <text x="15" y="35" fill="rgba(255,255,255,0.5)" font-family="system-ui" font-size="10" text-anchor="middle">History</text>
    </g>

    <g transform="translate(340, 12)">
      <circle cx="15" cy="12" r="10" fill="rgba(255,255,255,0.1)"/>
      <text x="15" y="35" fill="rgba(255,255,255,0.5)" font-family="system-ui" font-size="10" text-anchor="middle">Settings</text>
    </g>
  </g>
</svg>
