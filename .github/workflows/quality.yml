name: Quality Checks

on:
  schedule:
    # Run daily at 6 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      full_audit:
        description: 'Run full audit including all checks'
        required: false
        default: 'true'
        type: boolean

concurrency:
  group: quality-checks
  cancel-in-progress: true

jobs:
  bundle-size:
    name: Bundle Size Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm build:web

      - name: Analyze bundle size
        run: |
          echo "## Bundle Size Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check .next directory for build output
          if [ -d "apps/web/.next" ]; then
            echo "### Next.js Build Output" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # Get total size
            TOTAL_SIZE=$(du -sh apps/web/.next 2>/dev/null | cut -f1)
            echo "**Total build size:** $TOTAL_SIZE" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # Check static chunks
            if [ -d "apps/web/.next/static/chunks" ]; then
              echo "### JavaScript Chunks" >> $GITHUB_STEP_SUMMARY
              echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
              find apps/web/.next/static/chunks -name "*.js" -exec ls -lh {} \; 2>/dev/null | awk '{print $5, $9}' | sort -hr | head -20 >> $GITHUB_STEP_SUMMARY
              echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            fi
          fi

      - name: Check bundle size limits
        run: |
          # Define size limits (in KB)
          MAX_TOTAL_SIZE_KB=5000  # 5MB total
          MAX_CHUNK_SIZE_KB=500   # 500KB per chunk

          FAILED=false

          # Check individual chunk sizes
          if [ -d "apps/web/.next/static/chunks" ]; then
            for file in apps/web/.next/static/chunks/*.js; do
              if [ -f "$file" ]; then
                SIZE_KB=$(du -k "$file" | cut -f1)
                if [ "$SIZE_KB" -gt "$MAX_CHUNK_SIZE_KB" ]; then
                  echo "::warning::Large chunk detected: $(basename $file) is ${SIZE_KB}KB (limit: ${MAX_CHUNK_SIZE_KB}KB)"
                  FAILED=true
                fi
              fi
            done
          fi

          # Check total build size
          if [ -d "apps/web/.next" ]; then
            TOTAL_SIZE_KB=$(du -sk apps/web/.next | cut -f1)
            if [ "$TOTAL_SIZE_KB" -gt "$MAX_TOTAL_SIZE_KB" ]; then
              echo "::warning::Total build size ${TOTAL_SIZE_KB}KB exceeds limit ${MAX_TOTAL_SIZE_KB}KB"
              FAILED=true
            fi
          fi

          if [ "$FAILED" = true ]; then
            echo "Bundle size check found issues (warnings only)"
          else
            echo "Bundle size check passed!"
          fi

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security audit
        run: |
          echo "## Dependency Security Audit" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Run pnpm audit and capture output
          pnpm audit --json > audit-results.json 2>&1 || true

          # Parse and display results
          if [ -f "audit-results.json" ]; then
            CRITICAL=$(jq '.advisories | to_entries | map(select(.value.severity == "critical")) | length' audit-results.json 2>/dev/null || echo "0")
            HIGH=$(jq '.advisories | to_entries | map(select(.value.severity == "high")) | length' audit-results.json 2>/dev/null || echo "0")
            MODERATE=$(jq '.advisories | to_entries | map(select(.value.severity == "moderate")) | length' audit-results.json 2>/dev/null || echo "0")
            LOW=$(jq '.advisories | to_entries | map(select(.value.severity == "low")) | length' audit-results.json 2>/dev/null || echo "0")

            echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
            echo "| :--- | :---: |" >> $GITHUB_STEP_SUMMARY
            echo "| Critical | $CRITICAL |" >> $GITHUB_STEP_SUMMARY
            echo "| High | $HIGH |" >> $GITHUB_STEP_SUMMARY
            echo "| Moderate | $MODERATE |" >> $GITHUB_STEP_SUMMARY
            echo "| Low | $LOW |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check for critical vulnerabilities
        run: |
          # Fail if there are critical or high vulnerabilities
          pnpm audit --audit-level=critical || exit 0

      - name: Check for outdated dependencies
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Outdated Dependencies" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          pnpm outdated 2>&1 | head -50 >> $GITHUB_STEP_SUMMARY || echo "All dependencies are up to date!" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  lighthouse-audit:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.full_audit == 'true' || github.event_name == 'schedule' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm build:web

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.13.x

      - name: Start local server
        run: |
          cd apps/web
          pnpm start &
          sleep 10

      - name: Run Lighthouse CI
        run: |
          lhci autorun \
            --collect.url="http://localhost:3000" \
            --collect.url="http://localhost:3000/body" \
            --collect.url="http://localhost:3000/progress" \
            --collect.numberOfRuns=3 \
            --upload.target=temporary-public-storage \
            --assert.preset=lighthouse:recommended || true

      - name: Generate Lighthouse Report
        run: |
          echo "## Lighthouse Performance Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f ".lighthouseci/manifest.json" ]; then
            for file in .lighthouseci/lhr-*.json; do
              if [ -f "$file" ]; then
                URL=$(jq -r '.finalUrl' "$file")
                PERF=$(jq '.categories.performance.score * 100 | floor' "$file")
                A11Y=$(jq '.categories.accessibility.score * 100 | floor' "$file")
                BP=$(jq '.categories["best-practices"].score * 100 | floor' "$file")
                SEO=$(jq '.categories.seo.score * 100 | floor' "$file")

                echo "### $URL" >> $GITHUB_STEP_SUMMARY
                echo "| Performance | Accessibility | Best Practices | SEO |" >> $GITHUB_STEP_SUMMARY
                echo "| :---: | :---: | :---: | :---: |" >> $GITHUB_STEP_SUMMARY
                echo "| $PERF | $A11Y | $BP | $SEO |" >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY
              fi
            done
          fi

  accessibility-audit:
    name: Accessibility Audit
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.full_audit == 'true' || github.event_name == 'schedule' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm build:web

      - name: Install axe-core CLI
        run: npm install -g @axe-core/cli

      - name: Start local server
        run: |
          cd apps/web
          pnpm start &
          sleep 10

      - name: Run accessibility tests
        run: |
          echo "## Accessibility Audit Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Test multiple pages
          for path in "" "body" "progress" "settings"; do
            echo "### Testing /$path" >> $GITHUB_STEP_SUMMARY
            axe "http://localhost:3000/$path" --exit 2>&1 | tee -a $GITHUB_STEP_SUMMARY || true
            echo "" >> $GITHUB_STEP_SUMMARY
          done

  quality-summary:
    name: Quality Summary
    runs-on: ubuntu-latest
    needs: [bundle-size, dependency-audit, lighthouse-audit, accessibility-audit]
    if: always()
    steps:
      - name: Generate Quality Report
        run: |
          echo "## Quality Checks Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :---: |" >> $GITHUB_STEP_SUMMARY
          echo "| Bundle Size | ${{ needs.bundle-size.result == 'success' && ':white_check_mark:' || ':x:' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Audit | ${{ needs.dependency-audit.result == 'success' && ':white_check_mark:' || ':x:' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lighthouse Audit | ${{ needs.lighthouse-audit.result == 'success' && ':white_check_mark:' || (needs.lighthouse-audit.result == 'skipped' && ':yellow_circle:' || ':x:') }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Accessibility Audit | ${{ needs.accessibility-audit.result == 'success' && ':white_check_mark:' || (needs.accessibility-audit.result == 'skipped' && ':yellow_circle:' || ':x:') }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "*Run completed at: $(date -u)*" >> $GITHUB_STEP_SUMMARY

      - name: Create issue on critical failures
        if: ${{ needs.dependency-audit.result == 'failure' }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Quality Check Failed - ${new Date().toISOString().split('T')[0]}`,
              body: `## Quality Check Failure

              The scheduled quality checks have detected issues that require attention.

              ### Results
              - Bundle Size: ${{ needs.bundle-size.result }}
              - Dependency Audit: ${{ needs.dependency-audit.result }}
              - Lighthouse Audit: ${{ needs.lighthouse-audit.result }}
              - Accessibility Audit: ${{ needs.accessibility-audit.result }}

              Please review the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.
              `,
              labels: ['quality', 'automated']
            });
